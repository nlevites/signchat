# Cross-dataset "broad" pretrain stage (secondary path; PopSign single-source
# in pretrain_phase1_kaggle.yaml is the primary path).
#
# Trains a transfer-base encoder on the union of all available datasets:
# ASL Citizen targeted-gloss-list extract, WLASL2000 (MuteMotion +
# DIY-MediaPipe), and Kaggle ISLR (PopSign). The broad model is a
# sacrificial encoder; the deliverable is the tight model that head-swaps
# off this one for the 25-sign Coffee Chat demo lexicon.
#
# Recipe:
#   - inherits the small Conformer + position+velocity+acceleration + CutMix
#     defaults from base.yaml (asl-signs Kaggle 1st/2nd-place winner recipe)
#   - softer augmentations (rot=15, time=0.8-1.2)
#   - 60 epochs with patience 15 so val_acc plateaus have room to breathe
#   - Custom signer-disjoint splits (per-clip Participant ID), combining
#     train+val+test as the training pool while preserving signer
#     disjointness for val

extends: base.yaml

experiment:
  name: phase1_broad
  kind: pretrain                 # routes to pretrained/phase1_broad/
  notes: "Cross-dataset broad: targeted ASL Citizen + WLASL2000 + Kaggle ISLR, soft augs, 60ep"

data:
  cache_dir:
    # Union vocab is ~1,000-1,200 unique glosses after alias collapse.
    - data/cache/asl_citizen     # primary - targeted extract (~219 signs, 6,791 clips, per-participant)
    - data/cache/wlasl           # legacy MuteMotion pre-extract (~682 glosses, 6,208 clips, per-split)
    - data/cache/wlasl_full      # WLASL2000 raw extract via our MediaPipe (~500 glosses, 4,482 clips,
                                 #   per-signer). 318 of those glosses are NOT in MuteMotion.
    - data/cache/kaggle_islr     # Google Kaggle ISLR / PopSign (250 signs, 94,290 clips,
                                 #   per-participant; densest source by ~10x)
  vocab: auto                    # union over all cache vocab.json files
  splits_path: data/splits/asl_citizen.json
  use_smoke: false

train:
  batch_size: 256                # H200 has the headroom; CLI override possible
  epochs: 60
  lr: 5e-4
  warmup_epochs: 3
  schedule: cosine
  early_stop_patience: 15
