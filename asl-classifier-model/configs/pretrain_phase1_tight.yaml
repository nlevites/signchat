# "Tight" stage. Demo-target model.
#
# Resumes the broad encoder via head-swap, then trains a small softmax over
# the locked Coffee Chat lexicon (~25 signs) with all available clips of
# those specific signs. Goal: high per-class confidence on the demo lexicon.
#
# vocab:
#   * Sourced from data/vocab/tight.json which scripts/curate_vocab.py
#     materializes after WLASL top-2000 + ASL Citizen targeted extract land.
#     The file lists the resolved dataset-specific gloss strings (e.g.
#     "DEAF1", "thankyou") in the original Coffee Chat display order, with
#     any failing slots auto-substituted from the backup pool.
# resume:
#   * load_weights(by_name=True, skip_mismatch=True) drops the broad's
#     wide-vocab head and the tight build_classifier creates a fresh
#     ~25-class head. The encoder's positional encoding + Conformer blocks
#     load cleanly.

extends: base.yaml

experiment:
  name: phase1_tight
  kind: pretrain                 # routes to pretrained/phase1_tight/
  notes: "Tight: Coffee Chat lexicon, head-swap from broad, demo target"

data:
  cache_dir:
    # Same 4-cache union as broad.
    - data/cache/asl_citizen
    - data/cache/wlasl           # legacy MuteMotion (~682 glosses, 6,208 clips)
    - data/cache/wlasl_full      # WLASL2000 raw extract via our MediaPipe (~500 glosses, 4,482 clips)
    - data/cache/kaggle_islr     # Google Kaggle ISLR / PopSign (250 signs, 94,290 clips)
  vocab:
    file: data/vocab/tight.json  # produced by scripts/curate_vocab.py --write-tight-vocab
  splits_path: data/splits/asl_citizen.json
  use_smoke: false

train:
  batch_size: 128                # smaller batch helps with the smaller dataset (~750 train clips)
  epochs: 25
  lr: 1e-4                       # 5x lower than broad - we're fine-tuning, not training
  warmup_epochs: 1
  schedule: cosine
  early_stop_patience: 8
  resume_from: pretrained/phase1_broad/best.weights.h5
