# Google Kaggle ISLR (asl-signs / PopSign) smoke training run.
#
# Two epochs on the Kaggle 250-sign vocab alone, using the same small
# Conformer architecture as `pretrain_phase1_kaggle.yaml` (dim=192, 6 blocks,
# n_channels=9, max_len=160 -- the asl-signs Kaggle 1st/2nd-place winners'
# recipe). Purpose: VALIDATE that the landmark coords coming out of the
# Kaggle pre-extracted parquets train correctly with our local preprocessing
# recipe (130-landmark subset, motion deltas + acceleration, per-clip
# mean/std normalization). MediaPipe-version drift between Kaggle's 2023
# extraction and our 0.10.9 inference would show up here as val_acc << random.
#
# Decision gate:
#   val_acc >= 0.10 (epoch 2) -> recipe is healthy; proceed to full
#                                pretrain_phase1_kaggle.yaml run
#   val_acc <  0.10           -> regression vs the prior 0.106 baseline;
#                                debug schema/version drift before more spend
#
# Cost target: ~$3 (H200 ~45 min). 250 classes * ~378 clips/class is
# extremely dense; 2 epochs is more than enough signal for the parity check.
# We never run more than 2 here regardless of patience because the point is
# a parity check, not the production model.

extends: base.yaml

experiment:
  name: phase1_kaggle_smoke
  kind: pretrain                  # routes to pretrained/phase1_kaggle_smoke/
  notes: "Kaggle ISLR (asl-signs) smoke: 250 classes, 2 epochs, drift gate"

data:
  cache_dir:
    - data/cache/kaggle_islr      # the only source on purpose
  vocab: auto                     # union over each cache_dir's vocab.json
  splits_path: data/splits/kaggle_islr.json
  use_smoke: false

train:
  batch_size: 256                 # H200 has plenty of headroom
  epochs: 2                       # smoke gate; do NOT bump
  lr: 5e-4                        # matches pretrain_phase1_kaggle.yaml full run
  warmup_epochs: 1                # 1/2 epochs warmup since total is short
  schedule: cosine
  early_stop_patience: 99         # don't early-stop a 2-epoch smoke
