# Base config for the hoyso48 1st-place asl-signs port.
#
# Faithful copy of cell 19 of the reference notebook:
#   https://github.com/hoyso48/Google---Isolated-Sign-Language-Recognition-1st-place-solution/blob/main/ISLR_1st_place_Hoyeol_Sohn.ipynb
#
# Key choices that diverge from a generic recipe (so don't "fix" them):
#   - max_len=384 (most clips fit, the rest are temporally cropped)
#   - 6 channels = (x, y, dx, dy, dx2_x, dx2_y); z is dropped on purpose
#   - Lookahead-RectifiedAdam (sma_threshold=4, sync_period=5)
#   - OneCycleLR with warmup_epochs=0, decay_type=cosine, lr=4e-3 peak
#     (5e-4 * 8 replicas in the original; we run on a single H200 at the
#     same effective batch=512 so the same peak lr applies)
#   - weight_decay=0.1 follows the same OneCycle shape as the LR
#   - AWP (delta=0.2) starting epoch 15
#   - LateDropout(0.8) starting epoch 15

experiment:
  name: base
  notes: ""

data:
  vocab: auto                     # union of cache_dir/vocab.json files
  cache_dir: data/cache/kaggle_islr
  splits_path: data/splits/kaggle_islr.json
  max_len: 384

model:
  dim: 192                         # 384 doubles depth; only set on big-model runs
  kernel_size: 17                  # depthwise 1D conv kernel
  transformer_expand: 2            # FFN expand ratio inside transformer block
  conv_drop: 0.2                   # dropout inside Conv1DBlock
  late_drop: 0.8                   # LateDropout rate before classifier

train:
  batch_size: 512                  # 8 TPU * 64 in original; H200 fits this fine
  epochs: 300
  lr: 4.0e-3                       # 5e-4 * 8 replicas
  lr_min: 1.0e-6
  weight_decay: 0.1
  warmup_epochs: 0                 # original sets warmup=0 (cell 19)
  warmup_type: linear
  decay_type: cosine
  label_smoothing: 0.1
  awp: true
  awp_lambda: 0.2
  awp_start_epoch: 15
  dropout_start_epoch: 15
  early_stop_patience: 0           # 0 = no early stop (300 epochs is the budget)
  resume_from: null

eval:
  metric: val_signer_acc
  benchmark_latency: true
